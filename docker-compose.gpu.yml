services:
  transcription:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: transcription-service-gpu
    ports:
      - "8080:5000"
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./models:/app/models
      # Settings saved from the page live here, so they outlive the container.
      - ./data:/app/data
    # Settings are changed in the page and saved under ./data. A .env file is
    # optional: anything in it overrides the built-in defaults, and anything
    # saved from the page overrides that.
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Without an init process, python runs as PID 1 and never acts on
    # SIGTERM, so stopping the container ends in a SIGKILL and an
    # alarming "Exited (137)" in Docker Desktop.
    init: true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
