services:
  transcription:
    build: .
    # Named after the project rather than Compose's default of
    # <folder>-<service>, so it reads as transcription-service in Docker Desktop.
    image: transcription-service
    container_name: transcription-service
    # This machine only. There is no login, so the service is not published to
    # the network; to reach it from other devices, use "8080:5000" instead,
    # knowing that anyone on that network can then use and reconfigure it.
    ports:
      - "127.0.0.1:8080:5000"
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./models:/app/models
      # Settings saved from the page live here, so they outlive the container.
      - ./data:/app/data
    # Settings are changed in the page and saved under ./data. A .env file is
    # optional: anything in it overrides the built-in defaults, and anything
    # saved from the page overrides that.
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    # Without an init process, python runs as PID 1 and never acts on
    # SIGTERM, so stopping the container ends in a SIGKILL and an
    # alarming "Exited (137)" in Docker Desktop.
    init: true
    restart: unless-stopped
    # Docker Desktop provides this name already; the mapping is what makes the
    # host reachable on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
