services:
  transcription:
    build: .
    container_name: transcription-service
    ports:
      - "8080:5000"
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./models:/app/models
    # Compose reads ./.env automatically for these substitutions, so a .env file
    # overrides any of them, and the defaults apply when there is no .env at all.
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - GEMMA_MODEL_NAME=${GEMMA_MODEL_NAME:-gemma4:e4b}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-600}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-auto}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    # Without an init process, python runs as PID 1 and never acts on
    # SIGTERM, so stopping the container ends in a SIGKILL and an
    # alarming "Exited (137)" in Docker Desktop.
    init: true
    restart: unless-stopped
    # Docker Desktop provides this name already; the mapping is what makes the
    # host reachable on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
